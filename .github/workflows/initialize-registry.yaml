name: Initialize private portfolio registry
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check package before initialization
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}
        run: node scripts/initialize-ghcr.mjs
      - uses: docker/login-action@v4
        if: steps.prepare.outputs.existing != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}
      - name: Create empty package without project source or repository linkage
        if: steps.prepare.outputs.existing != 'true'
        run: |
          printf 'FROM scratch\nLABEL purpose="empty-registry-initialization"\n' | docker build -t ghcr.io/eowiin/portfolio:bootstrap -
          docker push ghcr.io/eowiin/portfolio:bootstrap
      - name: Verify private visibility before allowing application publication
        env:
          GH_TOKEN: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}
        run: node scripts/ghcr.mjs verify
