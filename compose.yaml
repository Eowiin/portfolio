name: ethan-portfolio

services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:?Renseigner une image GHCR avec son digest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORTFOLIO_PORT:-3001}:3000"
    cpus: "${PORTFOLIO_CPUS:-1.0}"
    mem_limit: ${PORTFOLIO_MEMORY:-512m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
